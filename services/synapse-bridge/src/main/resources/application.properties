spring.application.name=ecommerce

server.port=8080

authentication=ActiveDirectoryServicePrincipal

# Nissan
spring.datasource.nissan.driver-class-name=${NISSAN_DRIVER_CLASS}
spring.datasource.nissan.jdbc-url=${NISSAN_JDBC_URL}
spring.datasource.nissan.username=${NISSAN_USERNAME}
spring.datasource.nissan.password=${NISSAN_PASSWORD}

# ERP: lakehouse del Link to Fabric (SQL analytics endpoint, solo lectura, service principal).
# Sustituye al datasource "erp" de Synapse serverless.
spring.datasource.fabric.driver-class-name=${FABRIC_DRIVER_CLASS}
spring.datasource.fabric.jdbc-url=${FABRIC_JDBC_URL}
spring.datasource.fabric.username=${FABRIC_USERNAME}
spring.datasource.fabric.password=${FABRIC_PASSWORD}
spring.datasource.fabric.hikari.maximum-pool-size=${FABRIC_POOL_SIZE:3}
spring.datasource.fabric.hikari.connection-timeout=${FABRIC_CONNECTION_TIMEOUT:60000}
spring.datasource.fabric.hikari.max-lifetime=${FABRIC_MAX_LIFETIME:1800000}
spring.datasource.fabric.hikari.read-only=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

sync.stock.cron-expression=${SYNC_STOCK_CRON}
sync.items.cron-expression=${SYNC_ITEMS_CRON}
sync.existencias.cron-expression=${SYNC_EXISTENCIAS_CRON}
sync.cron.zone=${SYNC_CRON_ZONE:America/Mexico_City}

# Health probes (Azure Container Apps): /actuator/health/liveness y /readiness.
# El indicador de BD va desactivado para que una caída temporal del ERP, Nissan
# o Fabric no haga que la plataforma recicle el contenedor en bucle.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false

# =====================================================================
# Toda la configuracion sensible se lee de variables de entorno.
# Sintaxis: ${NOMBRE_VAR:valor_por_defecto}
# Ver .env.example para la lista completa.
# =====================================================================

spring.application.name = EcommerceMiddleware

# >>>>> INTEGRATION COMPANY <<<<<
integration.company.name = ${INTEGRATION_COMPANY_NAME:MULTIVENDE}

# >>>>>>>>>>>>>> SERVIDOR / SSL <<<<<<<<<<<<<<<<<<<<<<<<<<<
# En Azure Container Apps el TLS lo termina el ingress: la app escucha HTTP en 8080.
# Para correr con HTTPS local pon SERVER_SSL_ENABLED=true y SERVER_PORT=443.
server.port = ${SERVER_PORT:8080}
server.ssl.enabled = ${SERVER_SSL_ENABLED:false}
server.ssl.key-store = ${SERVER_SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password = ${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type = ${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias = ${SERVER_SSL_KEY_ALIAS:tomcat}
# Necesario detras del ingress de Azure para que las URLs generadas usen https
server.forward-headers-strategy = ${SERVER_FORWARD_HEADERS_STRATEGY:FRAMEWORK}

# >>>>>>>>>>>>>> ACTUATOR / HEALTH PROBES <<<<<<<<<<<<<<<<<
management.endpoints.web.exposure.include = ${MANAGEMENT_ENDPOINTS:health,info}
management.endpoint.health.probes.enabled = true
management.endpoint.health.show-details = never
# El health no debe caer si una BD externa esta temporalmente inaccesible:
# de lo contrario Container Apps reciclaria el contenedor en bucle.
management.health.db.enabled = ${MANAGEMENT_HEALTH_DB_ENABLED:false}

# >>>>> AZURE MYSQL -> VEGUSA MIDDLEWARE -> DB1 <<<<<
spring.veg-middleware.datasource.jdbc-url = ${MW_DB_URL:}
spring.veg-middleware.datasource.username = ${MW_DB_USERNAME:}
spring.veg-middleware.datasource.password = ${MW_DB_PASSWORD:}
spring.veg-middleware.datasource.driver-class-name = ${MW_DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.data.jpa.repositories.enabled = true
spring.jpa.generate-ddl = false
spring.jpa.database = default

# >>>>> AZURE SYNAPSE -> VEGUSA DYN365 -> DB2 <<<<<
spring.msb-data-lake.datasource.jdbc-url = ${MSB_DB_URL:}
spring.msb-data-lake.datasource.username = ${MSB_DB_USERNAME:}
spring.msb-data-lake.datasource.password = ${MSB_DB_PASSWORD:}
spring.msb-data-lake.datasource.driver-class-name = ${MSB_DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.jpa.hibernate.dialect = ${MSB_DB_DIALECT:org.hibernate.dialect.SQLServerDialect}

# >>>>> CORS <<<<<
# Lista separada por comas. Ej: https://mi-front.azurewebsites.net,http://127.0.0.1:5500
cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500}

# >>>>> EXTRA CONFIGURATIONS <<<<<
# Indicates how often the token will be refreshed in milliseconds - Actually 5 hours and 45 minutes
fixedRateRefreshToken.in.milliseconds = 20700000
# Indicates the first delay to refresh token the first time the application run in milliseconds - Actually 5 hours and 45 minutes
fixedDelayRefreshToken.in.milliseconds = 20700000
fixedDelayRefreshAuthInfo.in.milliseconds = 20710000
# Indicates how often the Item Inventory will be refreshed in milliseconds - Actually 1 hour
fixedRateRefreshItemInventory.in.milliseconds = 3600000
# Indicates the first delay to refresh Item Inventory the first time the application run in milliseconds - Actually 1 minute
fixedDelayRefreshItemInventory.in.milliseconds = 30000
# Indicates how often the Price Lists will be refreshed in milliseconds - Actually 2 hours
fixedRateRefreshPriceLists.in.milliseconds = 7200000
# Indicates the first delay to refresh Price Lists the first time the application run in milliseconds - Actually 1 minute
fixedDelayRefreshPriceLists.in.milliseconds = 60000

# >>>>>>> JUMPSELLER CONFIRGURATIONS <<<<<<<<<<<<<<
jumpseller.api.base-url = ${JUMPSELLER_API_BASE_URL:https://api.jumpseller.com/v1}

# >>>>>>>> MERCADO LIBRE CONFIGURATIONS <<<<<<<<<<<<<<<
mercadolibre.api.base-url = ${MERCADOLIBRE_API_BASE_URL:https://api.mercadolibre.com}

# >>>>>>>>> CAMSO CONFIGURATIONS <<<<<<<<<<<<<<<<<<
camso.api.base-url = ${CAMSO_API_BASE_URL:https://api.michelin.com}

# >>>>>>>>> MULTIVENDE CONFIGURATIONS <<<<<<<<<<<<<<<
multivende.api.base-url = ${MULTIVENDE_API_BASE_URL:https://app.multivende.com}

# >>>>>>>>> WEB SCRAPER (servicio externo) <<<<<<<<<<<<<<<
webscraper.api.base-url = ${WEBSCRAPER_API_BASE_URL:http://localhost:8080/veg-web-scraper}
